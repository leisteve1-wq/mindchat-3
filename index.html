    <!-- Service Worker Registration -->
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/',
              updateViaCache: 'none'
            });
            
            console.log('[App] Service Worker registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('[App] Service Worker update found');
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[App] New version available');
                  // Dispatch event to app
                  window.dispatchEvent(new CustomEvent('sw-update-available'));
                }
              });
            });
            
            // Check for updates periodically
            setInterval(() => {
              registration.update();
              console.log('[App] Checking for Service Worker updates...');
            }, 60000); // Check every minute
            
          } catch (error) {
            console.error('[App] Service Worker registration failed:', error);
          }
        });
        
        // Listen for messages from Service Worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data.type === 'SW_ACTIVATED') {
            console.log('[App] Service Worker activated, version:', event.data.version);
            window.dispatchEvent(new CustomEvent('sw-activated', { detail: event.data }));
          }
        });
      }
      
      // Version info
      window.APP_VERSION = '1.0.0';
      window.APP_BUILD_DATE = new Date().toISOString();
    </script>
